<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#0F172A"/>
  <rect x="0" y="0" width="1400" height="88" fill="#111827"/>
  <circle cx="64" cy="44" r="18" fill="#60A5FA"/>
  <text x="98" y="52" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700">Snippet Editor</text>
  <rect x="1160" y="22" width="170" height="42" rx="12" fill="#2563EB"/>
  <text x="1195" y="49" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Save</text>

  <rect x="110" y="140" width="1180" height="640" rx="22" fill="#1E293B" stroke="#334155"/>
  <rect x="110" y="140" width="1180" height="62" rx="22" fill="#0B1220"/>
  <circle cx="150" cy="171" r="8" fill="#F87171"/>
  <circle cx="176" cy="171" r="8" fill="#FBBF24"/>
  <circle cx="202" cy="171" r="8" fill="#4ADE80"/>
  <text x="280" y="182" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="24" font-weight="600">useFetch.ts</text>

  <rect x="130" y="220" width="1060" height="500" rx="14" fill="#0F172A"/>
  <text x="160" y="275" fill="#93C5FD" font-family="monospace" font-size="24">export async function fetchData() {</text>
  <text x="160" y="325" fill="#E2E8F0" font-family="monospace" font-size="24">  const response = await fetch('/api/snippets');</text>
  <text x="160" y="375" fill="#E2E8F0" font-family="monospace" font-size="24">  return response.json();</text>
  <text x="160" y="425" fill="#E2E8F0" font-family="monospace" font-size="24">}</text>
  <text x="160" y="500" fill="#86EFAC" font-family="monospace" font-size="22">// cached server response</text>
  <text x="160" y="550" fill="#FCD34D" font-family="monospace" font-size="22">const data = await fetchData();</text>
  <text x="160" y="600" fill="#F9A8D4" font-family="monospace" font-size="22">console.log(data);</text>
</svg>
